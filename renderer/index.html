<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- CSP sættes i tauri.conf.json, så Tauris IPC kommer med -->
  <title>AI Copilot Mapper</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Tekster sættes fra strings.js: data-i18n = tekst, data-i18n-title = title + aria-label,
       data-tip = værktøjstip -->
  <div id="app">
    <aside id="sidebar">
      <div class="brand"><img class="brand-icon" src="icon.png" alt="" /> AI Copilot Mapper</div>
      <div class="side-head">
        <span data-i18n="FrameAI"></span>
        <button class="icon-btn" id="btn-new-ai" data-i18n-title="BtnAddCustom">＋</button>
      </div>
      <nav id="ai-list" aria-label="AI"></nav>
      <div class="sidebar-foot">
        <div id="foot"></div>
        <button class="icon-btn foot-btn" id="btn-settings" data-i18n-title="MenuSettings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></svg>
        </button>
        <button class="icon-btn foot-btn" id="btn-about" data-i18n-title="MenuAbout">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 11v5M12 7.5h.01" /></svg>
        </button>
        <label class="lang-pick" data-i18n-title="MenuLanguage">
          <span class="lang-icon" aria-hidden="true">🌐</span>
          <select id="lang-select"></select>
        </label>
      </div>
    </aside>

    <main id="main">
      <div id="toolbar">
        <button class="tool" data-cmd="sidebar" data-tip="TipSidebar" data-key="Ctrl+B">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5" /><path d="M9 4v16" /></svg>
        </button>
        <span class="tool-sep"></span>
        <button class="tool" data-cmd="back" data-tip="TipBack" data-key="Alt+←">
          <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" /></svg>
        </button>
        <button class="tool" data-cmd="forward" data-tip="TipForward" data-key="Alt+→">
          <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" /></svg>
        </button>
        <button class="tool" data-cmd="reload" data-tip="TipReload" data-key="F5">
          <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-3.9L4 9" /><path d="M4 4v5h5" /><path d="M4 13a8 8 0 0 0 14.9 3.9L20 15" /><path d="M20 20v-5h-5" /></svg>
        </button>
        <span class="tool-title" id="title"></span>
        <button class="tool" data-cmd="external" data-tip="TipExternal">
          <svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" /></svg>
        </button>
      </div>
      <!-- Pladsholder: AI-siden er en WebView2 som Rust lægger præcis oven på dette felt -->
      <div id="view"></div>
      <div id="external" class="empty" hidden>
        <img src="icon.png" alt="" />
        <h2 id="external-name"></h2>
        <p id="external-text"></p>
        <button class="btn btn-primary" data-cmd="external" data-i18n="TipExternal"></button>
      </div>
    </main>

    <aside id="editor" class="panel" hidden>
      <header class="panel-head">
        <h2 id="editor-title"></h2>
        <button class="icon-btn" id="editor-close" data-i18n-title="BtnClose">✕</button>
      </header>
      <form id="ai-form" autocomplete="off" novalidate>
        <label><span data-i18n="FieldName"></span><input name="name" /></label>
        <label><span data-i18n="FieldURL"></span><input name="url" spellcheck="false" placeholder="http://localhost:3000" /></label>
        <label class="check"><input type="checkbox" name="external" /> <span data-i18n="AlwaysExternal"></span></label>
        <p class="form-error" id="form-error" hidden></p>
        <footer class="panel-foot">
          <button type="button" class="btn btn-danger" id="btn-delete" hidden data-i18n="BtnDelete"></button>
          <span class="spacer"></span>
          <button type="submit" class="btn btn-primary" data-i18n="BtnSave"></button>
        </footer>
      </form>
    </aside>
  </div>

  <div id="modal" class="modal-backdrop" hidden><div class="modal" id="modal-box"></div></div>
  <div id="toasts"></div>

  <script src="strings.js"></script>
  <script src="hotkey.js"></script>
  <script src="tauri-api.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
